<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <!-- Matte Black PVD Titanium Gradient -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="28%" stop-color="#2A3448"/>
      <stop offset="48%" stop-color="#43516C"/>
      <stop offset="72%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="45%" stop-color="#E5B84B"/>
      <stop offset="100%" stop-color="#7D560F"/>
    </linearGradient>

    <linearGradient id="rainStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0088FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF5E00" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="thermoBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FF5E00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030711" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowAqua" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowCol" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 3D Pedestal Base -->
  <ellipse cx="195" cy="340" rx="136" ry="22" fill="url(#thermoBase)"/>
  <ellipse cx="195" cy="340" rx="98" ry="14" fill="none" stroke="#00F0FF" stroke-width="1.4" stroke-dasharray="8 6" opacity="0.65"/>

  <g filter="url(#shadowCol)">
    <!-- Vertical Telescopic Riser Column -->
    <rect x="112" y="42" width="12" height="248" rx="6" fill="url(#matteBlack)" stroke="#43516C" stroke-width="0.7"/>
    <!-- Top Gooseneck Arm -->
    <path d="M 118 48 C 118 20, 246 20, 246 54" fill="none" stroke="url(#matteBlack)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 118 48 C 118 20, 246 20, 246 54" fill="none" stroke="#5A6B8C" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Ultra-Slim 30x30cm XXL Rain Shower Head -->
    <rect x="239" y="50" width="14" height="12" rx="3" fill="url(#goldTrim)"/>
    <path d="M 164 62 L 328 62 L 336 74 L 156 74 Z" fill="url(#matteBlack)" stroke="url(#goldTrim)" stroke-width="1.3"/>
    <ellipse cx="246" cy="75" rx="88" ry="5" fill="#0B1325" stroke="#00F0FF" stroke-width="0.9"/>

    <!-- Wall Bracket -->
    <rect x="96" y="108" width="28" height="14" rx="4" fill="url(#matteBlack)" stroke="url(#goldTrim)" stroke-width="0.9"/>

    <!-- Handshower Holder & Matte Black Handset -->
    <rect x="106" y="164" width="28" height="14" rx="4" fill="url(#goldTrim)"/>
    <rect x="140" y="128" width="18" height="58" rx="6" fill="url(#matteBlack)" stroke="#5A6B8C" stroke-width="1"/>
    <rect x="144" y="132" width="10" height="24" rx="3" fill="#00F0FF" opacity="0.35"/>

    <!-- Thermostatic 38°C Piano Mixer Bar -->
    <rect x="68" y="268" width="136" height="32" rx="10" fill="url(#matteBlack)" stroke="url(#goldTrim)" stroke-width="1.4"/>
    <!-- Digital 38°C LED Readout -->
    <rect x="116" y="274" width="44" height="20" rx="5" fill="#040914" stroke="#00F0FF" stroke-width="1"/>
    <text x="123" y="288" font-family="monospace, sans-serif" font-weight="800" font-size="12" fill="#00F0FF">38°C</text>
    <!-- Piano Keys & Knobs -->
    <circle cx="84" cy="284" r="9" fill="url(#goldTrim)"/>
    <circle cx="188" cy="284" r="9" fill="url(#goldTrim)"/>
    <line x1="176" y1="278" x2="176" y2="290" stroke="#FF3B30" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Glowing Rain Jets from XXL Overhead Shower -->
  <g filter="url(#glowAqua)">
    <line x1="178" y1="80" x2="170" y2="332" stroke="url(#rainStream)" stroke-width="2.2" stroke-dasharray="10 6"/>
    <line x1="196" y1="80" x2="190" y2="336" stroke="url(#rainStream)" stroke-width="2.4"/>
    <line x1="214" y1="80" x2="210" y2="338" stroke="url(#rainStream)" stroke-width="2.2" stroke-dasharray="14 5"/>
    <line x1="232" y1="80" x2="230" y2="340" stroke="url(#rainStream)" stroke-width="2.6"/>
    <line x1="250" y1="80" x2="252" y2="340" stroke="url(#rainStream)" stroke-width="2.6"/>
    <line x1="268" y1="80" x2="272" y2="338" stroke="url(#rainStream)" stroke-width="2.2" stroke-dasharray="12 6"/>
    <line x1="286" y1="80" x2="292" y2="336" stroke="url(#rainStream)" stroke-width="2.4"/>
    <line x1="304" y1="80" x2="312" y2="332" stroke="url(#rainStream)" stroke-width="2.2" stroke-dasharray="10 6"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(20, 40)">
    <rect x="0" y="0" width="136" height="30" rx="15" fill="#081226" fill-opacity="0.9" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#FF5E00"/>
    <text x="27" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#F8FAFC" letter-spacing="0.8">THERMOSTAT 38°C</text>
  </g>
</svg>

