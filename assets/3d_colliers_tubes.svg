<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <!-- Halcor Pure Copper Gradient -->
    <linearGradient id="halcorCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="28%" stop-color="#EA580C"/>
      <stop offset="48%" stop-color="#FDBA74"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Galvanized Steel Clamp Gradient -->
    <linearGradient id="steelClamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="brassClamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78520D"/>
      <stop offset="40%" stop-color="#F3D068"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#523607"/>
    </linearGradient>

    <radialGradient id="copperBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E00" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#E5B84B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030711" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowTubes" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
  </defs>

  <ellipse cx="190" cy="334" rx="140" ry="22" fill="url(#copperBase)"/>
  <ellipse cx="190" cy="334" rx="102" ry="14" fill="none" stroke="#E5B84B" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7"/>

  <g filter="url(#shadowTubes)">
    <!-- Halcor Copper Coil Rings (Left/Center) -->
    <ellipse cx="152" cy="196" rx="76" ry="76" fill="none" stroke="url(#halcorCopper)" stroke-width="18"/>
    <ellipse cx="152" cy="196" rx="58" ry="58" fill="none" stroke="url(#halcorCopper)" stroke-width="16"/>
    <ellipse cx="152" cy="196" rx="42" ry="42" fill="none" stroke="url(#halcorCopper)" stroke-width="14"/>

    <!-- Straight Copper & PEX-Al-PEX Multilayer Pipes -->
    <rect x="68" y="84" width="210" height="18" rx="9" transform="rotate(-12 68 84)" fill="url(#halcorCopper)" stroke="#FDBA74" stroke-width="0.8"/>
    <rect x="78" y="110" width="210" height="16" rx="8" transform="rotate(-12 78 110)" fill="url(#steelClamp)" stroke="#00F0FF" stroke-width="1"/>

    <!-- Heavy-Duty Isophonic Pipe Clamp (Collier de Fixation Acier + EPDM) -->
    <g transform="translate(245, 215)">
      <!-- Threaded Rod & Dowel -->
      <rect x="-7" y="54" width="14" height="48" rx="3" fill="url(#steelClamp)"/>
      <!-- EPDM Black Rubber Lining -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#0F172A" stroke-width="16"/>
      <!-- Galvanized Steel Outer Band -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="url(#steelClamp)" stroke-width="10"/>
      <!-- Flanges & Locking Bolts -->
      <rect x="-74" y="-8" width="22" height="16" rx="3" fill="url(#steelClamp)"/>
      <rect x="52" y="-8" width="22" height="16" rx="3" fill="url(#steelClamp)"/>
      <circle cx="-63" cy="0" r="4" fill="#E5B84B"/>
      <circle cx="63" cy="0" r="4" fill="#E5B84B"/>
    </g>

    <!-- Brass Double Clamp -->
    <g transform="translate(115, 290)">
      <circle cx="-24" cy="0" r="22" fill="none" stroke="url(#brassClamp)" stroke-width="8"/>
      <circle cx="24" cy="0" r="22" fill="none" stroke="url(#brassClamp)" stroke-width="8"/>
      <rect x="-12" y="-6" width="24" height="12" rx="3" fill="url(#brassClamp)"/>
    </g>
  </g>

  <g transform="translate(18, 28)">
    <rect x="0" y="0" width="154" height="28" rx="14" fill="#081226" fill-opacity="0.92" stroke="#E5B84B" stroke-width="1.2"/>
    <circle cx="15" cy="14" r="4.5" fill="#EA580C"/>
    <text x="26" y="18" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#F8FAFC" letter-spacing="0.8">HALCOR &amp; COLLIERS PRO</text>
  </g>
</svg>

