<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 88" fill="none">
  <defs>
    <!-- Dégradé C + Goutte d'Eau (Aqua Cristallin -> Cyan -> Bleu Azur) -->
    <linearGradient id="crgAquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80FFFF"/>
      <stop offset="35%" stop-color="#00E5FF"/>
      <stop offset="75%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#0044AA"/>
    </linearGradient>

    <linearGradient id="crgDropInner" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E8FFFF"/>
      <stop offset="30%" stop-color="#00F0FF"/>
      <stop offset="75%" stop-color="#0077E6"/>
      <stop offset="100%" stop-color="#002B7A"/>
    </linearGradient>

    <!-- Dégradé R (Bleu Saphir Royal & Cobalt Pro) -->
    <linearGradient id="crgRoyalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2998FF"/>
      <stop offset="45%" stop-color="#005CE6"/>
      <stop offset="100%" stop-color="#002D72"/>
    </linearGradient>

    <!-- Dégradé G (Rouge Rubis -> Orange Thermique) -->
    <linearGradient id="crgFireG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D50022"/>
      <stop offset="50%" stop-color="#FF2A00"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>

    <!-- Dégradé Flamme Extérieure (Rouge Feu -> Orange Vif -> Or Solaire) -->
    <linearGradient id="flameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D50000"/>
      <stop offset="35%" stop-color="#FF3D00"/>
      <stop offset="75%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <!-- Dégradé Flamme Coeur (Or -> Blanc Incandescent) -->
    <linearGradient id="flameCore" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="55%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFFDE7"/>
    </linearGradient>

    <!-- Dégradé Or Laiton Impérial -->
    <linearGradient id="crgBrassGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="50%" stop-color="#E5B84B"/>
      <stop offset="100%" stop-color="#FF7733"/>
    </linearGradient>

    <!-- Filtres de Lueur Haute Définition (Eau & Flamme) -->
    <filter id="aquaGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="flameGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.8" result="blur1" />
      <feGaussianBlur stdDeviation="5.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .crg-flame-group {
        transform-origin: 158px 25px;
        animation: flameFlicker 2.2s ease-in-out infinite alternate;
      }
      .crg-drop-group {
        transform-origin: 31px 44px;
        animation: dropPulse 2.8s ease-in-out infinite alternate;
      }
      @keyframes flameFlicker {
        0% { transform: scale(1) rotate(-1.2deg); filter: brightness(1); }
        50% { transform: scale(1.06, 1.09) rotate(1.5deg); filter: brightness(1.18); }
        100% { transform: scale(0.98, 1.04) rotate(-0.5deg); filter: brightness(1.08); }
      }
      @keyframes dropPulse {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-1.2px) scale(1.03); }
      }
    </style>
  </defs>

  <!-- MONOGRAMME EMBLÉMATIQUE CRG (C Goutte d'Eau + R Cobalt + G Flamme) -->
  <g transform="translate(6, 5)">
    <!-- 1. LETTRE "C" HYDRO-SCULPTÉE AVEC GOUTTE D'EAU INTÉGRÉE -->
    <g filter="url(#aquaGlow)">
      <path d="M50 22 H41 C37 22 34 23.5 32 25.5 C29 19.5 22 18 16 21 C8 25 4 33.5 4 44 C4 57.5 14.5 67 29.5 67 C40.5 67 48.5 61.5 51.5 52.5 L42.5 49.5 C40.2 55 35.5 58 29.5 58 C20 58 14 51.5 14 44 C14 36.5 19 30 27 29.5 L50 29.5 Z"
            fill="url(#crgAquaGrad)" stroke="#B3FFFF" stroke-width="0.7"/>
      <rect x="43" y="19" width="8" height="12" rx="1.5" fill="url(#crgAquaGrad)"/>
    </g>

    <!-- Goutte d'Eau Cristalline sculptée au coeur du C -->
    <g class="crg-drop-group" filter="url(#aquaGlow)">
      <path d="M31 19 C31 19 43.5 36.5 43.5 45.5 C43.5 52.8 37.9 58.2 31 58.2 C24.1 58.2 18.5 52.8 18.5 45.5 C18.5 36.5 31 19 31 19 Z"
            fill="url(#crgDropInner)" stroke="#FFFFFF" stroke-width="1.1"/>
      <path d="M27.5 28 C25 34 22.2 40 22.5 45.5 C22.8 49.5 25.5 52.8 29 53.5 C25.8 51.2 24.8 47.5 25.5 43 C26.2 38 28.5 32.5 30 27 Z"
            fill="#FFFFFF" opacity="0.7"/>
      <circle cx="31.5" cy="49.5" r="3.4" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="36.2" cy="45.2" r="1.8" fill="#FFFFFF" opacity="0.78"/>
    </g>

    <!-- 2. LETTRE "R" ARCHITECTURE COBALT -->
    <g>
      <path d="M57 20 H85 C95.5 20 102 25.5 102 33.8 C102 40.2 97.5 44.8 90.5 46.5 L103.5 66 H90.5 L79.5 48 H70 V66 H57 V20 Z M70 30 V39.5 H83 C87.2 39.5 89.8 37.3 89.8 34.7 C89.8 32 87.2 30 83 30 H70 Z"
            fill="url(#crgRoyalBlue)" stroke="#80D8FF" stroke-width="0.9"/>
      <rect x="54" y="19" width="8" height="6" rx="1" fill="url(#crgRoyalBlue)"/>
      <rect x="54" y="61" width="19" height="6" rx="1" fill="url(#crgRoyalBlue)"/>
      <rect x="88" y="61" width="17" height="6" rx="1" fill="url(#crgRoyalBlue)"/>
    </g>

    <!-- 3. LETTRE "G" RUBIS THERMIQUE & SA FLAMME ARDENTE -->
    <g>
      <path d="M153 20 H163 V34 H153 C151 28.5 145.5 26 138 26 C126.5 26 119 33.5 119 43.5 C119 53.8 126.5 60.5 138.5 60.5 C145.5 60.5 150.5 58.2 152.5 54 V49 H140 V40.5 H164 V65.5 H154.5 L153.5 61.5 C149 65.5 143 67.2 135.5 67.2 C119 67.2 107.5 57.2 107.5 43.5 C107.5 29.5 119.5 19.2 136.5 19.2 C143.5 19.2 149.2 21 153 24.2 V20 Z"
            fill="#160509" stroke="url(#crgFireG)" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M153 20 H163 V34 H153 C151 28.5 145.5 26 138 26 C126.5 26 119 33.5 119 43.5 C119 53.8 126.5 60.5 138.5 60.5 C145.5 60.5 150.5 58.2 152.5 54 V49 H140 V40.5 H164 V65.5 H154.5"
            fill="none" stroke="#FFAB40" stroke-width="0.9" opacity="0.8"/>

      <!-- LA FLAMME SIGNATURE CRG (Au sommet droit du G) -->
      <g class="crg-flame-group" filter="url(#flameGlow)">
        <path d="M158 -3 C158 -3 173 9 171 20.5 C169.5 27 163.5 30 161 30.5 C164.8 26 165.5 19.5 158 12.5 C151.2 19.5 151.8 26 155 30.5 C151.8 29.5 146.2 26 145.5 19.5 C144.2 9 158 -3 158 -3 Z"
              fill="url(#flameOuter)"/>
        <path d="M158 6.5 C158 6.5 167 15 165.2 22.5 C164.2 26.5 161 29 159.5 29.8 C161.2 26.5 161.5 22 158 17 C154.5 22 154.8 26.5 156.5 29.8 C154.8 28.8 151.8 26 151 22 C149.8 14.8 158 6.5 158 6.5 Z"
              fill="url(#flameCore)"/>
        <path d="M158 15.5 C158 15.5 162.2 21 161.2 25.5 C160.4 28 158 29.8 158 29.8 C158 29.8 155.6 28 154.8 25.5 C153.8 21 158 15.5 158 15.5 Z"
              fill="#FFFDF5"/>
      </g>
    </g>

    <!-- Sous-ligne bicolore Eau & Flamme sous CRG -->
    <rect x="6" y="72" width="98" height="3.2" rx="1.6" fill="url(#crgAquaGrad)"/>
    <rect x="108" y="72" width="58" height="3.2" rx="1.6" fill="url(#flameOuter)"/>
  </g>

  <!-- TYPOGRAPHIE OFFICIELLE & BADGE HAUT DE GAMME -->
  <g transform="translate(182, 13)">
    <rect x="0" y="0" width="228" height="20" rx="10" fill="rgba(8, 20, 48, 0.9)" stroke="url(#crgBrassGold)" stroke-width="1.1"/>
    <circle cx="12" cy="10" r="3.6" fill="#00E5FF"/>
    <circle cx="21" cy="10" r="3.6" fill="#FF5500"/>
    <text x="32" y="13.5" font-family="'Outfit', sans-serif" font-weight="800" font-size="9.5" letter-spacing="1.5" fill="#FFFFFF">
      AQUAPRO &amp; THERMOPRO • ORAN
    </text>

    <text x="0" y="37" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14.5" letter-spacing="0.6" fill="#FFFFFF">
      COMPTOIR ROBINETTERIE
    </text>
    <text x="0" y="53" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14.2" letter-spacing="0.9" fill="url(#crgBrassGold)">
      GÉNÉRALE • SARL CRG
    </text>

    <text x="0" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.3" letter-spacing="1.0" fill="#9CC2F5">
      FONDÉE EN 1992 À ORAN • 4ÈME PÉRIPHÉRIQUE ES-SÉNIA
    </text>
  </g>
</svg>
