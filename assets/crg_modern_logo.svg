<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none">
  <defs>
    <!-- Dégradé Eau Cyan & Bleu Profond -->
    <linearGradient id="crgWaterGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>

    <!-- Dégradé Laiton / Or Industriel -->
    <linearGradient id="crgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Filtre Lueur Néon Cyan -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbole Emblème Moderne (Goutte d'eau & Vanne Hydro-Dynamique) -->
  <g transform="translate(10, 5)">
    <!-- Anneau Hexagonal Extérieur Robinetterie -->
    <path d="M30 4 L54 18 L54 46 L30 60 L6 46 L6 18 Z" 
          stroke="url(#crgWaterGlow)" stroke-width="2.5" fill="rgba(0, 113, 220, 0.12)" filter="url(#cyanGlow)"/>

    <!-- Goutte d'eau stylisée fluide centrale -->
    <path d="M30 14 C30 14 44 32 44 40 C44 48 37.7 54 30 54 C22.3 54 16 48 16 40 C16 32 30 14 30 14 Z" 
          fill="url(#crgWaterGlow)"/>

    <!-- Point de pureté / reflet d'eau -->
    <circle cx="26" cy="36" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Accent Laiton Valve Quart de Tour -->
    <path d="M22 24 L38 24" stroke="url(#crgGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Texte Logotype Futuriste & Puissant -->
  <g transform="translate(82, 10)">
    <!-- Sigle CRG -->
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#FFFFFF">
      CRG
    </text>
    
    <!-- Badge AQUAPRO -->
    <rect x="88" y="10" width="92" height="22" rx="11" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1"/>
    <text x="134" y="25" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" letter-spacing="1.5" fill="#00F0FF">
      AQUAPRO
    </text>

    <!-- Sous-titre officiel -->
    <text x="1" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.8" fill="#B4D3FF" opacity="0.9">
      COMPTOIR DE ROBINETTERIE GÉNÉRALE
    </text>
    
    <!-- Coordonnées Dépôt 4ème Rocade -->
    <text x="1" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7.5" letter-spacing="1.2" fill="#D4AF37">
      ORAN • 4ÈME PÉRIPHÉRIQUE ES-SÉNIA
    </text>
  </g>
</svg>
