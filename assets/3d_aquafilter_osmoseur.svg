<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <linearGradient id="housingBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022B69"/>
      <stop offset="30%" stop-color="#0088FF"/>
      <stop offset="55%" stop-color="#7CE8FF"/>
      <stop offset="85%" stop-color="#0051B5"/>
      <stop offset="100%" stop-color="#011B45"/>
    </linearGradient>

    <linearGradient id="capWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="roMembrane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#003580"/>
    </linearGradient>

    <radialGradient id="aquaBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0088FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030711" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 3D Pedestal Ring -->
  <ellipse cx="190" cy="336" rx="142" ry="22" fill="url(#aquaBase)"/>
  <ellipse cx="190" cy="336" rx="104" ry="14" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7"/>

  <g filter="url(#shadowFilter)">
    <!-- Top RO Membrane Horizontal Cylinder -->
    <rect x="92" y="54" width="196" height="36" rx="18" fill="url(#roMembrane)" stroke="#7CE8FF" stroke-width="1.2"/>
    <rect x="115" y="61" width="150" height="8" rx="4" fill="#FFFFFF" opacity="0.45"/>
    <text x="135" y="77" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" letter-spacing="1.2">AQUAFILTER RO-75GPD</text>

    <!-- Steel Mounting Bracket Plate -->
    <rect x="68" y="102" width="244" height="22" rx="6" fill="url(#capWhite)" stroke="#475569" stroke-width="1"/>

    <!-- Stage 1: Transparent Sediment 5 Micron Housing -->
    <rect x="76" y="118" width="66" height="22" rx="6" fill="url(#capWhite)"/>
    <path d="M 80 140 L 138 140 L 134 302 C 134 312, 84 312, 84 302 Z" fill="url(#housingBlue)" fill-opacity="0.82" stroke="#00F0FF" stroke-width="1.4"/>
    <!-- Inner White Polypropylene Cartridge -->
    <rect x="93" y="148" width="32" height="146" rx="6" fill="#F8FAFC" opacity="0.88"/>
    <text x="97" y="225" font-family="sans-serif" font-weight="800" font-size="9" fill="#022B69">5 µm</text>

    <!-- Stage 2: GAC Carbon Cartridge Housing -->
    <rect x="157" y="118" width="66" height="22" rx="6" fill="url(#capWhite)"/>
    <path d="M 161 140 L 219 140 L 215 302 C 215 312, 165 312, 165 302 Z" fill="url(#housingBlue)" stroke="#7CE8FF" stroke-width="1.1"/>
    <rect x="172" y="146" width="10" height="150" fill="#FFFFFF" opacity="0.3"/>
    <text x="172" y="225" font-family="sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">CARBON</text>

    <!-- Stage 3: CTO Block Filter Housing -->
    <rect x="238" y="118" width="66" height="22" rx="6" fill="url(#capWhite)"/>
    <path d="M 242 140 L 300 140 L 296 302 C 296 312, 246 312, 246 302 Z" fill="url(#housingBlue)" stroke="#7CE8FF" stroke-width="1.1"/>
    <rect x="253" y="146" width="10" height="150" fill="#FFFFFF" opacity="0.3"/>
    <text x="256" y="225" font-family="sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">CTO 1µm</text>

    <!-- Brass Pressure Gauge on Top -->
    <circle cx="109" cy="96" r="14" fill="#0B1325" stroke="#E5B84B" stroke-width="2.5"/>
    <line x1="109" y1="96" x2="116" y2="89" stroke="#FF3B30" stroke-width="1.8"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="148" height="28" rx="14" fill="#081226" fill-opacity="0.92" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="15" cy="14" r="4.5" fill="#00F0FF"/>
    <text x="26" y="18" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#F8FAFC" letter-spacing="0.8">AQUAFILTER OSMOSEUR</text>
  </g>
</svg>

