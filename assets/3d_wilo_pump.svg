<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <!-- Wilo Emerald Green & Cast Iron Industrial Gradients -->
    <linearGradient id="wiloGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="35%" stop-color="#00B248"/>
      <stop offset="75%" stop-color="#006927"/>
      <stop offset="100%" stop-color="#003D16"/>
    </linearGradient>

    <linearGradient id="castIron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="35%" stop-color="#2D3748"/>
      <stop offset="55%" stop-color="#4A5568"/>
      <stop offset="85%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <linearGradient id="brassUnion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#704F10"/>
      <stop offset="30%" stop-color="#E5B84B"/>
      <stop offset="55%" stop-color="#FFF2B2"/>
      <stop offset="85%" stop-color="#B3831E"/>
      <stop offset="100%" stop-color="#593D08"/>
    </linearGradient>

    <radialGradient id="wiloHoloBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#00E676" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#030711" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowPump" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
  </defs>

  <!-- 3D Pedestal Ring -->
  <ellipse cx="190" cy="332" rx="135" ry="24" fill="url(#wiloHoloBase)"/>
  <ellipse cx="190" cy="332" rx="98" ry="15" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="9 6" opacity="0.7"/>

  <g filter="url(#shadowPump)">
    <!-- Top & Bottom DN25 Brass Union Fittings (CW617N) -->
    <rect x="162" y="54" width="56" height="24" rx="4" fill="url(#brassUnion)" stroke="#4A3208" stroke-width="1"/>
    <polygon points="154,76 226,76 220,96 160,96" fill="url(#brassUnion)" stroke="#4A3208" stroke-width="1"/>

    <polygon points="160,278 220,278 226,298 154,298" fill="url(#brassUnion)" stroke="#4A3208" stroke-width="1"/>
    <rect x="162" y="298" width="56" height="24" rx="4" fill="url(#brassUnion)" stroke="#4A3208" stroke-width="1"/>

    <!-- Cast-Iron Hydraulic Volute Body -->
    <rect x="168" y="92" width="44" height="190" rx="10" fill="url(#castIron)"/>
    <circle cx="190" cy="187" r="78" fill="url(#castIron)" stroke="#4A5568" stroke-width="2"/>

    <!-- Wilo Green ECM Motor Housing (3D Cylindrical Projection) -->
    <circle cx="190" cy="187" r="64" fill="url(#wiloGreen)" stroke="#69F0AE" stroke-width="1.5"/>
    <!-- Cooling Fins -->
    <path d="M 136 160 L 244 160 M 132 175 L 248 175 M 132 199 L 248 199 M 136 214 L 244 214" stroke="#003D16" stroke-width="3" opacity="0.55"/>

    <!-- Front Electronic Control Module & LED Display -->
    <rect x="144" y="138" width="92" height="98" rx="16" fill="#0E1525" stroke="#00E676" stroke-width="1.6"/>
    <!-- Digital Watt / Head LED Screen -->
    <rect x="156" y="150" width="68" height="32" rx="6" fill="#030711" stroke="#00F0FF" stroke-width="1.2"/>
    <text x="163" y="171" font-family="monospace, sans-serif" font-weight="900" font-size="14" fill="#00E676">4.8m•18W</text>

    <!-- Wilo Green Push/Turn Rotary Knob -->
    <circle cx="190" cy="208" r="17" fill="url(#wiloGreen)" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="190" cy="208" r="8" fill="#0B1325"/>
    <line x1="190" y1="193" x2="190" y2="200" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 4 Stainless Allen Bolts -->
    <circle cx="142" cy="142" r="4.5" fill="#CBD5E1"/>
    <circle cx="238" cy="142" r="4.5" fill="#CBD5E1"/>
    <circle cx="142" cy="232" r="4.5" fill="#CBD5E1"/>
    <circle cx="238" cy="232" r="4.5" fill="#CBD5E1"/>
  </g>

  <!-- Dynamic Hydraulic Pressure Waves -->
  <path d="M 102 187 C 102 135, 138 102, 190 102" fill="none" stroke="#00F0FF" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.8"/>
  <path d="M 278 187 C 278 239, 242 272, 190 272" fill="none" stroke="#00E676" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.8"/>

  <!-- Floating Badge -->
  <g transform="translate(20, 38)">
    <rect x="0" y="0" width="138" height="30" rx="15" fill="#081226" fill-opacity="0.9" stroke="#00E676" stroke-width="1.3"/>
    <circle cx="16" cy="15" r="4.5" fill="#00E676"/>
    <text x="27" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#F8FAFC" letter-spacing="0.8">WILO ALLEMAGNE</text>
  </g>
</svg>
